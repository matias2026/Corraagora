<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados | CorraAgora (offline)</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/resultados-publicos.css">
    <link rel="stylesheet" href="assets/css/barra-offline.css">

    <!-- Tudo local, nada de CDN — tem que funcionar sem internet. -->
    <script src="assets/js/local-db.js"></script>
</head>

<body>

<div id="barraOffline" class="barra-offline"></div>

<main class="container resultados-page">

    <h1>Resultados</h1>
    <p class="subtitle">Acompanhe os resultados da prova em tempo real, à medida que a cronometragem registra as chegadas.</p>

    <div class="resultados-filtros">
        <select id="selectAnoFiltro">
            <option value="">Todos os anos</option>
        </select>
        <select id="selectModalidadeFiltro">
            <option value="">Todas as modalidades</option>
        </select>
    </div>

    <div class="resultados-selector">
        <select id="selectEventoResultados">
            <option value="">Selecione o evento...</option>
        </select>
        <button type="button" id="atualizarResultadosButton" class="btn btn-outline">🔄 Atualizar</button>
    </div>

    <div id="resultadosContainer" class="resultados-container"></div>

    <div id="semResultados" class="starter-empty hidden">
        <div class="starter-icon">🏁</div>
        <h3>Nenhum resultado ainda</h3>
        <p>Assim que a equipe de cronometragem registrar as primeiras chegadas, elas aparecem aqui.</p>
    </div>

</main>

<script src="assets/js/barra-offline.js"></script>
<script src="assets/js/resultados-publicos.js"></script>
</body>
</html>
