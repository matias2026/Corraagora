name: Build Cronometragem Desktop (Windows)

# Compila o instalador .exe do programa de cronometragem offline num
# Windows de verdade (precisa disso — não dá pra gerar um instalador do
# Windows a partir de Linux sem Wine). Dispara sozinho quando algo muda
# dentro de cronometragem-desktop/ no main, e também pode ser disparado
# manualmente na aba "Actions" do GitHub quando quiser gerar o instalador
# sem ter mudado nada no código.
on:
  push:
    branches: [main]
    paths:
      - "cronometragem-desktop/**"
      - ".github/workflows/build-cronometragem-desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: cronometragem-desktop

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o CSS (Tailwind)
        run: npm run build:css

      - name: Gerar o instalador do Windows
        run: npx electron-builder --win --publish never

      - name: Disponibilizar o instalador pra baixar (artifact da execução)
        uses: actions/upload-artifact@v4
        with:
          name: CronometragemCorraAgora-instalador-windows
          path: cronometragem-desktop/dist/*.exe
          if-no-files-found: error

      # Além do artifact acima (que expira e baixa compactado/mais devagar,
      # exigindo login no GitHub mesmo o repositório sendo público), publica
      # o mesmo .exe como um Release — link direto, sem zip, sem expirar e
      # sem precisar estar logado, porque o repositório é público.
      - name: Publicar o instalador como Release (download direto e mais rápido)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cronometragem-desktop-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create cronometragem-desktop-latest dist/*.exe \
            --repo "${{ github.repository }}" \
            --title "Cronometragem CorraAgora (instalador Windows)" \
            --notes "Instalador mais recente da cronometragem offline, gerado automaticamente a partir do commit ${{ github.sha }}. Sempre que o código mudar, este Release é substituído por uma versão nova no mesmo link."
